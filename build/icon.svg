<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bea"/>
      <stop offset="1" stop-color="#5aa8f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>

  <g clip-path="url(#tile)">
    <!-- she: long hair, body, face -->
    <path d="M530 480 A106 106 0 0 1 742 480 Q742 560 756 624 Q700 650 636 650 Q572 650 516 624 Q530 560 530 480 Z" fill="#17306e"/>
    <path d="M474 980 V742 Q474 608 636 608 Q798 608 798 742 V980 Z" fill="#dbeafe"/>
    <rect x="600" y="540" width="72" height="80" rx="20" fill="#cfe1fb"/>
    <circle cx="636" cy="484" r="90" fill="#ffffff"/>
    <!-- he: body (with a thin gap to separate from her), face, short hair -->
    <path d="M226 980 V732 Q226 598 388 598 Q550 598 550 732 V980 Z" fill="#ffffff" stroke="#3b78ee" stroke-width="10"/>
    <rect x="352" y="530" width="72" height="80" rx="20" fill="#e7effc"/>
    <circle cx="388" cy="470" r="96" fill="#ffffff"/>
    <path d="M292 466 A96 96 0 0 1 484 466 Q452 424 388 424 Q324 424 292 466 Z" fill="#17306e"/>
  </g>

  <!-- one pair of headphones shared by both -->
  <path d="M290 480 C290 250 726 250 726 480" fill="none" stroke="#0e2358" stroke-width="28" stroke-linecap="round"/>
  <rect x="262" y="440" width="52" height="124" rx="26" fill="#0e2358"/>
  <rect x="712" y="440" width="52" height="124" rx="26" fill="#0e2358"/>
  <rect x="276" y="462" width="24" height="80" rx="12" fill="#7cc0ff"/>
  <rect x="726" y="462" width="24" height="80" rx="12" fill="#7cc0ff"/>

  <!-- music note above them -->
  <g fill="#ffffff" transform="translate(512 190) scale(1.3) translate(-512 -190)">
    <ellipse cx="480" cy="228" rx="34" ry="26" transform="rotate(-22 480 228)"/>
    <rect x="502" y="120" width="14" height="106"/>
    <path d="M516 120 C548 132 574 150 570 190 C560 168 544 160 516 154 Z"/>
  </g>
</svg>
