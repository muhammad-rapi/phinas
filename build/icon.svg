<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d3df0"/>
      <stop offset="0.55" stop-color="#d23fe0"/>
      <stop offset="1" stop-color="#ff6b8b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe4f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a0a5e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>

  <!-- sound waves radiating from the top right -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="30" opacity="0.55">
    <path d="M806 178 A150 150 0 0 1 880 252"/>
    <path d="M790 118 A218 218 0 0 1 940 268" opacity="0.6"/>
  </g>

  <!-- beamed double eighth note -->
  <g fill="url(#note)" filter="url(#shadow)">
    <polygon points="318,352 742,262 742,372 318,462"/>
    <rect x="318" y="352" width="46" height="378"/>
    <rect x="696" y="276" width="46" height="364"/>
    <ellipse cx="282" cy="730" rx="108" ry="82" transform="rotate(-22 282 730)"/>
    <ellipse cx="660" cy="640" rx="108" ry="82" transform="rotate(-22 660 640)"/>
  </g>
</svg>
