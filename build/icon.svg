<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4fd6"/>
      <stop offset="1" stop-color="#3d97f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f1ff"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe0ff"/>
      <stop offset="1" stop-color="#8ec5fb"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2447bd"/>
      <stop offset="1" stop-color="#172a7a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe6ff"/>
    </linearGradient>
    <clipPath id="a"><circle cx="384" cy="512" r="282"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1c5c" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>

  <!-- two people, as two circles that meet -->
  <g filter="url(#soft)">
    <circle cx="384" cy="512" r="282" fill="url(#left)"/>
    <circle cx="640" cy="512" r="282" fill="url(#right)"/>
  </g>

  <!-- where they overlap: music -->
  <g clip-path="url(#a)">
    <circle cx="640" cy="512" r="282" fill="url(#lens)"/>
  </g>
  <g fill="url(#bar)">
    <rect x="416" y="436" width="48" height="152" rx="24"/>
    <rect x="488" y="352" width="48" height="320" rx="24"/>
    <rect x="560" y="404" width="48" height="216" rx="24"/>
  </g>
</svg>
