appId: id.phinas.app
productName: Phinas
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
afterPack: scripts/after-pack.cjs
# Where installed apps look for updates. Builds also write latest.yml (Windows), which must be
# uploaded to the GitHub release next to the installer and its .blockmap.
publish:
  provider: github
  owner: muhammad-rapi
  repo: phinas
mac:
  category: public.app-category.music
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
dmg:
  title: Phinas
win:
  icon: build/icon.ico
  # Skips code signing and Wine-based exe editing; the exe icon is set in scripts/after-pack.cjs.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: Phinas-Setup-${version}.${ext}
